<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Флаг Израиля в круглой плашке: белое полотно, две синие полосы и
       звезда Давида. Размер и обводка — как у остальных эмблем проекта. -->
  <defs>
    <clipPath id="round"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="30.5" fill="#ffffff" stroke="#111" stroke-width="1.6"/>

  <g clip-path="url(#round)">
    <rect x="0" y="13" width="64" height="7" fill="#0038b8"/>
    <rect x="0" y="44" width="64" height="7" fill="#0038b8"/>
    <g fill="none" stroke="#0038b8" stroke-width="2.6" stroke-linejoin="round">
      <polygon points="32,21 22.5,37.5 41.5,37.5"/>
      <polygon points="32,43 41.5,26.5 22.5,26.5"/>
    </g>
  </g>
</svg>
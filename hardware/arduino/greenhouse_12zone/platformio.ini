; Сборка прошивки для Arduino Nano без Arduino IDE:
;   pio run -d hardware/arduino/greenhouse_12zone
[platformio]
src_dir = .

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
